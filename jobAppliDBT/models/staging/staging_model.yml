version: 2

models:

  - name: staging_one_var

  - name: staging_skill
    description: "Flattened job postings from JobStreet, one row per job-skill pair."
    columns:
      - name: link
        description: "foreign key."
        tests:
          - not_null
          - unique
      - name: skill
        description: "A single skill extracted from the job posting's skills list."
        tests:
          - not_null
  - name: staging_qualification
  - name: staging_title
  - name: staging_conformed_single_val
  - name: foundit_unique_val_staging
  - name: jobstreet_unique_val_staging